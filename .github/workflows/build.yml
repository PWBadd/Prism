name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then echo "settings.gradle.kts NOT FOUND"; ls -R | head -50; exit 1; fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Project folder: $d"; ls -la "$d"

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
